# 메모 앱 내용을 옵시디언 `0. Inbox/Inbox_memo/`에 매일 두 번(05:00 · 22:00 KST) 기록
# 필요한 설정은 옵시디언 자동 보관과 같음 (Secrets: MEMO_PASSWORD, OBSIDIAN_TOKEN)
name: 메모 → Inbox_memo
on:
  # 예약 실행은 Apps Script "GH 디스패처"가 workflow_dispatch로 호출 (GitHub cron 3~6시간 지연 대응, 2026-11-08)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inbox-memo
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OBSIDIAN_REPO: ${{ vars.OBSIDIAN_REPO || 'juno99zz-arkt/obsidian-vault' }}
    steps:
      - uses: actions/checkout@v4
      - name: 옵시디언 저장소 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OBSIDIAN_REPO }}
          token: ${{ secrets.OBSIDIAN_TOKEN }}
          path: obsidian
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 메모 → Inbox_memo
        env:
          MEMO_PASSWORD: ${{ secrets.MEMO_PASSWORD }}
        run: node scripts/inbox-memo.mjs vault.json obsidian
      - name: 옵시디언 저장소에 커밋
        working-directory: obsidian
        run: |
          git config user.name "memo-app"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "바뀐 내용 없음"; exit 0; }
          git commit -m "메모 앱 → Inbox_memo: $(date +%F\ %H:%M)"
          git pull --rebase
          git push
