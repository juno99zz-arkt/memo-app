# 옵시디언 저장소(비공개)에 .md 노트로 자동 기록 — 매주 일요일 07:00(KST)
#   이번 주 노트 `YYYY-Www.md` (Completed Tasks · To do List · Memo 세 칸) + `To do.md`(이번 주 할 일) 갱신
#   지난 주 노트는 이 형식으로 이미 있고 앱 내용이 바뀐 경우에만 갱신, 예전 형식 노트는 건드리지 않음
# 필요한 설정 (memo-app → Settings → Secrets and variables → Actions):
#   Secrets  MEMO_PASSWORD   앱 비밀번호 (앱에서 비밀번호를 바꾸면 여기도 바꿔야 함)
#            OBSIDIAN_TOKEN  옵시디언 저장소에 쓸 수 있는 토큰 (Contents: Read and write)
#   Variables OBSIDIAN_REPO  옵시디언 저장소 (기본 juno99zz-arkt/obsidian-vault)
#             OBSIDIAN_FOLDER 노트 폴더 (비우면 앱 설정의 폴더, 기본 3. Area of Responsibility/주간 메모)
name: 옵시디언 자동 보관
on:
  schedule:
    - cron: "0 22 * * 6"   # 토 22:00 UTC = 일 07:00 KST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obsidian-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OBSIDIAN_REPO: ${{ vars.OBSIDIAN_REPO || 'juno99zz-arkt/obsidian-vault' }}
    steps:
      - name: 설정 확인
        env:
          HAS_PW: ${{ secrets.MEMO_PASSWORD != '' }}
          HAS_TOKEN: ${{ secrets.OBSIDIAN_TOKEN != '' }}
        run: |
          [ "$HAS_PW" = "true" ] || { echo "::error::MEMO_PASSWORD 시크릿을 등록하세요"; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::OBSIDIAN_TOKEN 시크릿을 등록하세요"; exit 1; }
      - uses: actions/checkout@v4
      - name: 옵시디언 저장소 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OBSIDIAN_REPO }}
          token: ${{ secrets.OBSIDIAN_TOKEN }}
          path: obsidian
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 메모장 → 옵시디언 노트
        env:
          MEMO_PASSWORD: ${{ secrets.MEMO_PASSWORD }}
          OBSIDIAN_FOLDER: ${{ vars.OBSIDIAN_FOLDER }}
        run: node scripts/export-obsidian.mjs vault.json obsidian
      - name: 옵시디언 저장소에 커밋
        working-directory: obsidian
        run: |
          git config user.name "memo-app"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 바뀐 노트가 없어도 토큰 쓰기 권한은 확인 (만료되면 이 단계가 실패)
          git diff --cached --quiet && { echo "바뀐 노트 없음"; git push --dry-run; exit 0; }
          git commit -m "메모 기록: $(date +%F)"
          git pull --rebase   # 옵시디언 Git 플러그인이 그사이 올린 백업과 합침
          git push
